<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Room themes</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #e4e8ee; font: 12px/1.4 -apple-system, "Inter", sans-serif; }
      #world { position: fixed; inset: 0; }
      #world canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
      #labels { position: fixed; inset: 0; pointer-events: none; }
      .label { position: absolute; pointer-events: auto; padding: 3px 8px; border-radius: 999px; background: rgba(255,255,255,.88); color: #111; text-decoration: none; font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.1); }
      #bar { position: fixed; left: 12px; right: 12px; bottom: 12px; display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
      #bar a { border-radius: 999px; padding: 5px 9px; background: rgba(255,255,255,.86); color: #111; text-decoration: none; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
      #bar a[aria-current="true"] { background: #111; color: #fff; }
      #bar i { width: 8px; }
      html[data-ui="0"] #bar, html[data-ui="0"] #labels { display: none; }
    </style>
  </head>
  <body>
    <div id="world"></div>
    <div id="labels"></div>
    <div id="bar"></div>
    <script type="module" src="./rooms.ts"></script>
  </body>
</html>
