<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Office preview</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #eef0f3; font: 12px/1.4 -apple-system, "Inter", sans-serif; }
      #world { position: fixed; inset: 0; }
      #world canvas { display: block; width: 100%; height: 100%; }
      #bar { position: fixed; left: 12px; bottom: 12px; display: flex; gap: 6px; flex-wrap: wrap; max-width: 92vw; }
      #bar button { border: 0; border-radius: 999px; padding: 6px 10px; background: rgba(255,255,255,.86); color: #111; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
      #bar button[aria-pressed="true"] { background: #111; color: #fff; }
      html[data-bar="0"] #bar { display: none; }
    </style>
  </head>
  <body>
    <div id="world"></div>
    <div id="bar"></div>
    <script type="module" src="./preview.ts"></script>
  </body>
</html>
