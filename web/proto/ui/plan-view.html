<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Plan preview</title>
  <!-- WP3 dev preview of the 30-day plan view on the saved real fixtures (no AI call). ?f=bakery-es | bikes-en -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --font-display: "Fraunces", Georgia, serif; --font-text: "Inter", system-ui, sans-serif; --c-ink: #14161b; --c-muted: #61656f; --c-line: rgba(10,12,17,.1); --c-fill: rgba(10,12,17,.05); --c-surface: #fff; --c-positive: #1d7a4a; }
    body { margin: 0; background: #eef0f3; }
    .wrap { max-width: 760px; margin: 0 auto; padding: 24px 16px 60px; }
    .card { background: #fff; border-radius: 20px; padding: 22px 22px 18px; box-shadow: 0 20px 50px -28px rgba(0,0,0,.35); }
    .bar { display: flex; gap: 8px; margin-bottom: 12px; font: 13px system-ui; }
    .bar a { color: #333; }
    @media (max-width: 560px) { .card { padding: 16px 14px; border-radius: 16px; } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="bar"><a href="?f=bakery-es">bakery-es</a> · <a href="?f=bikes-en">bikes-en</a></div>
    <div class="card" id="root"></div>
  </div>
  <script type="module">
    import qrcode from "qrcode-generator";
    import { mountPlanView } from "./plan-view.ts";
    const fixtures = import.meta.glob("../../../server/marketing/fixtures/*.json");
    const key = new URLSearchParams(location.search).get("f") || "bakery-es";
    const load = fixtures[`../../../server/marketing/fixtures/${key}.json`] ?? fixtures["../../../server/marketing/fixtures/bakery-es.json"];
    const f = (await load()).default;
    const siteUrl = `https://launchdesk.example/${f.input.slug}`;
    const q = qrcode(0, "M"); q.addData(siteUrl); q.make();
    const n = q.getModuleCount(); let d = "";
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += `M${c + 2} ${r + 2}h1v1h-1z`;
    const qrSvg = `<svg viewBox="0 0 ${n + 4} ${n + 4}" role="img" aria-label="QR code"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#111"/></svg>`;
    const tab = Number(new URLSearchParams(location.search).get("tab") || 0);
    mountPlanView(document.getElementById("root"), { plan: f.result.plan, sources: f.result.sources, brand: f.input.brand, siteUrl, qrSvg });
    if (tab) document.querySelector(`[data-pv-tab="${tab}"]`)?.click();
  </script>
</body>
</html>
