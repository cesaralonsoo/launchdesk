# Keeps the live demo awake while the BCH BLAZE 2026 judges test it (Render's free plan sleeps after 15 idle minutes,
# and the first visit after that waits for a cold start). Pings the health check every 10 minutes until 28 Nov 2026.
name: keep-warm
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the live demo
        run: |
          if [ "$(date -u +%Y%m%d)" -gt 20261128 ]; then echo "Judging is over; nothing to do."; exit 0; fi
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 90 https://launchdesk-bch.onrender.com/healthz) && [ "$code" = "200" ] && { echo "awake ($code)"; exit 0; }
            echo "try $i: $code"; sleep 20
          done
          exit 1
